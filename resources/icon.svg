<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#1b4a38"/><stop offset=".6" stop-color="#0f2c21"/><stop offset="1" stop-color="#071710"/>
    </radialGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b7759"/><stop offset="1" stop-color="#184b38"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd1aa" stop-opacity=".55"/><stop offset=".25" stop-color="#7fd1aa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="wash" cx="512" cy="700" r="340" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 700) scale(1.15 .8) translate(-512 -700)">
      <stop offset="0" stop-color="#ffc56b" stop-opacity=".75"/><stop offset=".45" stop-color="#ffc56b" stop-opacity=".22"/><stop offset="1" stop-color="#ffc56b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd48a" stop-opacity="0"/><stop offset=".14" stop-color="#ffe2a8"/><stop offset=".5" stop-color="#fff6e0"/><stop offset=".86" stop-color="#ffe2a8"/><stop offset="1" stop-color="#ffd48a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><path d="M432 220 H592 A220 220 0 0 1 812 440 V540 A220 220 0 0 1 592 760 H252 A40 40 0 0 1 212 720 V440 A220 220 0 0 1 432 220 Z"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="bloom" x="-50%" y="-400%" width="200%" height="900%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- shadow -->
  <path d="M432 220 H592 A220 220 0 0 1 812 440 V540 A220 220 0 0 1 592 760 H252 A40 40 0 0 1 212 720 V440 A220 220 0 0 1 432 220 Z" fill="#020a06" opacity=".45" transform="translate(0 26)" filter="url(#shadow)"/>
  <!-- bubble -->
  <path d="M432 220 H592 A220 220 0 0 1 812 440 V540 A220 220 0 0 1 592 760 H252 A40 40 0 0 1 212 720 V440 A220 220 0 0 1 432 220 Z" fill="url(#bubble)"/>
  <g clip-path="url(#clip)">
    <rect x="200" y="300" width="624" height="470" fill="url(#wash)"/>
  </g>
  <path d="M432 220 H592 A220 220 0 0 1 812 440 V540 A220 220 0 0 1 592 760 H252 A40 40 0 0 1 212 720 V440 A220 220 0 0 1 432 220 Z" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- light under the door -->
  <rect x="332" y="676" width="360" height="40" rx="20" fill="#ffc56b" opacity=".85" filter="url(#bloom)"/>
  <rect x="346" y="684" width="332" height="24" rx="12" fill="url(#core)"/>
</svg>
